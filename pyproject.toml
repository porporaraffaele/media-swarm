[project]
name = "media-swarm"
version = "0.1.0"
description = "AI-powered media company with 14 specialized agent teams"
requires-python = ">=3.12"
dependencies = [
    # Agent Framework
    "agno>=1.0.0",
    # LLM Providers
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    # Database
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    "sqlalchemy>=2.0.0",
    # Web & API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    # Data & Validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Search
    "tavily-python>=0.5.0",
    # Content & Scraping
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.0",
    # Telegram Bot
    "python-telegram-bot>=21.0",
    # Document Readers (for RAG pipeline)
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "aiofiles>=24.0.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "schedule>=1.2.0",
    "python-multipart>=0.0.12",
    # Dashboard
    "streamlit>=1.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
